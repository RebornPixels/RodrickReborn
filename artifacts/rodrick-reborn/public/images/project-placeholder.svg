<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b69;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <!-- Subtle grid dots -->
  <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity="0.06" />
  </pattern>
  <rect width="800" height="450" fill="url(#dots)" />
  <!-- Icon -->
  <g transform="translate(360, 165)">
    <rect x="0" y="0" width="80" height="60" rx="8" fill="none" stroke="url(#icon)" stroke-width="3" opacity="0.6"/>
    <polyline points="0,45 22,25 38,38 55,18 80,42" fill="none" stroke="url(#icon)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.6"/>
    <circle cx="22" cy="16" r="8" fill="none" stroke="url(#icon)" stroke-width="2.5" opacity="0.6"/>
  </g>
  <!-- Label -->
  <text x="400" y="272" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#94a3b8" letter-spacing="2">NO IMAGE</text>
</svg>
